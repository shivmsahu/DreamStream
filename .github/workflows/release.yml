name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger the workflow on version tags like v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows App
        run: flutter build windows --release

      - name: Compress Windows Release
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath DreamStream-Windows-Release.zip -Force

      - name: Build Android APK
        run: flutter build apk --release
        
      - name: Rename Android APK
        run: Copy-Item build\app\outputs\flutter-apk\app-release.apk -Destination DreamStream-Android-Release.apk -Force

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            DreamStream-Windows-Release.zip
            DreamStream-Android-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
